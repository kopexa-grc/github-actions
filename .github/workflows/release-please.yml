name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout only to run this repository's own action from ./github.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Kopexa Operator token opens the release PR, so its pull_request
      # workflows (actionlint) start on their own. No dispatch workaround needed.
      - id: release
        uses: ./github/release-please
        with:
          client-id: ${{ vars.KOPEXA_OPERATOR_CLIENT_ID }}
          private-key: ${{ secrets.KOPEXA_OPERATOR_PRIVATE_KEY }}
