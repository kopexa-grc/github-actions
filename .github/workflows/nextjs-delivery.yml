name: Release Please and Next.js delivery
on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string
      application:
        default: ""
        type: string
      staging-path:
        description: Deprecated; envs owns target paths
        default: ""
        type: string
      production-path:
        description: Deprecated; envs owns target paths
        default: ""
        type: string
      next-cache-target:
        default: /app/.next/cache
        type: string
      release-config:
        default: .release-please-config.json
        type: string
      release-manifest:
        default: .release-please-manifest.json
        type: string
    secrets:
      KOPEXA_OPERATOR_PRIVATE_KEY:
        description: Private key of the Kopexa Operator app; preferred over the legacy tokens below
        required: false
      RELEASE_PLEASE_TOKEN:
        description: Deprecated; use KOPEXA_OPERATOR_PRIVATE_KEY
        required: false
      GITOPS_TOKEN:
        description: Deprecated; use KOPEXA_OPERATOR_PRIVATE_KEY
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      staging: ${{ steps.gate.outputs.staging }}
    env:
      # Only a boolean, so the key itself never lands in the job environment.
      USE_KOPEXA_OPERATOR: ${{ secrets.KOPEXA_OPERATOR_PRIVATE_KEY != '' && vars.KOPEXA_OPERATOR_CLIENT_ID != '' }}
    steps:
      # Release PRs opened with GITHUB_TOKEN start no PR workflows, so they would
      # carry no required checks. A Kopexa Operator token does start them.
      - id: operator
        if: env.USE_KOPEXA_OPERATOR == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KOPEXA_OPERATOR_CLIENT_ID }}
          private-key: ${{ secrets.KOPEXA_OPERATOR_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.operator.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.release-config }}
          manifest-file: ${{ inputs.release-manifest }}
      - name: Exclude merged release PRs from staging (including reruns)
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: context.sha, per_page: 100
            });
            const releaseMerge = prs.some(pr => pr.merged_at &&
              pr.base.ref === 'main' &&
              pr.head.ref.startsWith('release-please--') &&
              pr.labels.some(label => ['autorelease: pending', 'autorelease: tagged'].includes(label.name)));
            core.setOutput('staging', String(!releaseMerge));
  staging:
    needs: release
    if: needs.release.outputs.created != 'true' && needs.release.outputs.staging == 'true'
    uses: ./.github/workflows/nextjs-image.yml
    with:
      environment: staging
      source-ref: ${{ github.sha }}
      dockerfile: ${{ inputs.dockerfile }}
      next-cache-target: ${{ inputs.next-cache-target }}
      image: ${{ inputs.image }}
      image-tag: staging-${{ github.sha }}
      application: ${{ inputs.application }}
    secrets:
      KOPEXA_OPERATOR_PRIVATE_KEY: ${{ secrets.KOPEXA_OPERATOR_PRIVATE_KEY }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  production:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/nextjs-image.yml
    with:
      environment: production
      source-ref: ${{ needs.release.outputs.tag }}
      dockerfile: ${{ inputs.dockerfile }}
      next-cache-target: ${{ inputs.next-cache-target }}
      image: ${{ inputs.image }}
      image-tag: ${{ needs.release.outputs.tag }}
      application: ${{ inputs.application }}
    secrets:
      KOPEXA_OPERATOR_PRIVATE_KEY: ${{ secrets.KOPEXA_OPERATOR_PRIVATE_KEY }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
