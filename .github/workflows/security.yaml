name: 'Security'

on:
  workflow_call: {}

jobs:
    analyze-codeql:

        name: Analyze CodeQL
        runs-on: ubuntu-latest
        steps:
            - name: Setup Go
              uses: kopexa-grc/github-actions/go/setup@main
              with:
                fetch-depth: 2

            - id: go_mod
              uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
              with:
                files: go.mod

            # Initializes the CodeQL tools for scanning.
            - name: Initialize CodeQL
              if: ${{ steps.go_mod.outputs.files_exists == 'true' }}
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                languages: go

            # The `go build` command must be used, as `go test` isn't traced by CodeQL.
            - name: Build project to allow CodeQL to track the sources
              if: ${{ steps.go_mod.outputs.files_exists == 'true' }}
              run: make build

            - name: Perform CodeQL Analysis
              if: ${{ steps.go_mod.outputs.files_exists == 'true' }}
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

    check-unicode-control-characters:
        name: Check Unicode CC
        runs-on: ubuntu-latest
        steps:
            - name: Check for Unicode Control Characters configuration
              id: check-config
              uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
              with:
                files: .unicode-control-characters.config.py

            - name: Check Unicode Control Characters
              if: ${{ steps.check-config.outputs.files_exists == 'false' }}
              run: touch .unicode-control-characters.config.py

            - name: Find Unicode Control Characters
              uses: pierdipi/unicode-control-characters-action@6800beb56cdab6b7edd517961adfd8a5bcbe2690 # v0.1.1
              with:
                args: --detailed --config .unicode-control-characters.config.py .
                

    govulncheck:
        name: Go Vulnerability Detection
        runs-on: ubuntu-latest
        env:
            GOPATH: ${{ github.workspace }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Go
              uses: kopexa-grc/github-actions/go/setup@main

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                path: ./src/github.com/${{ github.repository }}

            - name: Govulncheck scan
              working-directory: ./src/github.com/${{ github.repository }}
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./... || true