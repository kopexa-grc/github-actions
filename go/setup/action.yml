name: Go Setup
description: |
   Go setup that allows for builds against dependencies within the kopexa-grc GitHub organisation.
  

inputs:
  github-token:
    description: |
      GitHub token used to fetch kopexa-grc internal repos.
    required: false
  go-mod-file:
    description: |
      Path to the go.mod file.
    required: false
    default: ./go.mod
  display-install-info:
    description: |
      If true, the install information is displayed.
    required: false
    default: "false"
  fetch-depth:
    description: 'Number of commits to fetch. 0 indicates all history for all branches and tags.'
    default: "1"

runs:
  using: 'composite'
  steps:
    - name: Set Token from Input
      shell: bash
      run: |
        echo "KOPEXA_CLOUD_REPO_ACCESS_TOKEN=${{ inputs.github-token }}" >> "${GITHUB_ENV}"

    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-tags: true
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install Go
      id: install-go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-mod-file }}
        cache-dependency-path: "**/go.sum"
      
    - name: Configure Git for private modules
      shell: bash
      run: |
        git config --global url."https://${{ env.KOPEXA_CLOUD_REPO_ACCESS_TOKEN }}@github.com/kopexa-grc".insteadOf \
        "https://github.com/kopexa-grc"

        echo "GOPRIVATE=github.com/kopexa-grc" >> "${GITHUB_ENV}"
        
    - name: Display install Information
      if: ${{ inputs.display-install-info == 'true' }}
      shell: bash
      run: |
        echo "
        # ✅ Go Setup completed successfully

        Go Version: ${{ steps.install-go.outputs.go-version }}
        Cache Hit: ${{ steps.install-go.outputs.cache-hit }}

        " >> "${GITHUB_STEP_SUMMARY}"