---
name: Release Please with Kopexa Operator
description:
  Run Release Please with a short-lived Kopexa Operator token, so release PRs
  trigger the repository's required checks
author: Kopexa
inputs:
  client-id:
    description: Kopexa Operator client ID, usually vars.KOPEXA_OPERATOR_CLIENT_ID
    default: ''
    required: false
  private-key:
    description: |
      Kopexa Operator private key, usually secrets.KOPEXA_OPERATOR_PRIVATE_KEY.
      Without client-id and private-key, github-token is used instead.
    default: ''
    required: false
  github-token:
    description: Fallback token when no Kopexa Operator credentials are given
    default: ${{ github.token }}
    required: false
  config-file:
    description: Release Please config; ignored when release-type is set
    default: .release-please-config.json
    required: false
  manifest-file:
    description: Release Please manifest; ignored when release-type is set
    default: .release-please-manifest.json
    required: false
  release-type:
    description: Single-package mode without config files (for example node, go, simple)
    default: ''
    required: false
  target-branch:
    description: Branch to release from; defaults to the repository default branch
    default: ''
    required: false
outputs:
  release_created:
    description: "'true' when a release was created for the root package"
    value: ${{ steps.release.outputs.release_created }}
  releases_created:
    description: "'true' when any release was created"
    value: ${{ steps.release.outputs.releases_created }}
  tag_name:
    description: Tag of the root package release
    value: ${{ steps.release.outputs.tag_name }}
  version:
    description: Version of the root package release, without the leading v
    value: ${{ steps.release.outputs.version }}
  major:
    description: Major version of the root package release
    value: ${{ steps.release.outputs.major }}
  minor:
    description: Minor version of the root package release
    value: ${{ steps.release.outputs.minor }}
  patch:
    description: Patch version of the root package release
    value: ${{ steps.release.outputs.patch }}
  sha:
    description: Commit the root package release was tagged on
    value: ${{ steps.release.outputs.sha }}
  upload_url:
    description: Upload URL of the root package release
    value: ${{ steps.release.outputs.upload_url }}
  prs_created:
    description: "'true' when a release PR was opened or updated"
    value: ${{ steps.release.outputs.prs_created }}
  pr:
    description: JSON of the first release PR
    value: ${{ steps.release.outputs.pr }}
  prs:
    description: JSON array of all release PRs
    value: ${{ steps.release.outputs.prs }}
  paths_released:
    description: JSON array of released package paths (monorepos)
    value: ${{ steps.release.outputs.paths_released }}
  outputs-json:
    description: |
      All Release Please outputs as JSON, including per-path keys such as
      "apps/web--tag_name". Read them with fromJSON(...)['apps/web--tag_name'].
    value: ${{ toJSON(steps.release.outputs) }}

runs:
  using: composite
  steps:
    - name: Mint Kopexa Operator token
      id: operator
      if: inputs.client-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    # release-please-action reads config-file/manifest-file only while
    # release-type is unset, so exactly one of the two modes is passed.
    - name: Release Please
      id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.operator.outputs.token || inputs.github-token }}
        release-type: ${{ inputs.release-type }}
        config-file: ${{ inputs.release-type == '' && inputs.config-file || '' }}
        manifest-file: ${{ inputs.release-type == '' && inputs.manifest-file || '' }}
        target-branch: ${{ inputs.target-branch }}
