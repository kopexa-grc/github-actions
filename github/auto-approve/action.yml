---
name: GitHub PR Auto-Approve
description:
  Automatically approve PRs based on user and label criteria
author: mspoeri
inputs:
  users:
    description: |
      comma separated list of GitHub users matched against the last actor.
      If empty, all users are matched.
    default: ''
    required: false
  labels:
    description: |
      comma separated list of GitHub labels matched against the PR labels.
      If empty, all labels are matched.
    default: ''
    required: false
  github-token:
    description: 'GitHub token used to approve the Pull Request'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup GitHub token ENV vars
      shell: bash
      run: |
        echo "GITHUB_TOKEN=${{ inputs.github-token }}" >> "${GITHUB_ENV}"
        echo "GH_TOKEN=${{ inputs.github-token }}" >> "${GITHUB_ENV}"
    - name: Qualify for auto-approval
      uses: actions/github-script@v7
      id: qualify
      with:
        users: ${{ inputs.users }}
        labels: ${{ inputs.labels }}
        script: |
          const qualifyUsers = core.getMultilineInput("users");
          const qualifyLabels = core.getMultilineInput("labels");
          const actor = context.actor
          const prLabels = context.payload.pull_request.labels;

          var qualify = true;

          // If users are specified, check if the last actor is in the list
          if (qualifyUsers.length > 0) {
              qualify = false;
              for (const user of qualifyUsers) {
                if (user === actor) {
                    console.log(`actor ${actor} is in the list of qualified users`);
                    qualify = true;
                }
              }
          }

          // If a user was qualified and labels are specified, check if the PR labels contain any of the labels
          if (qualify && qualifyLabels.length > 0) {
              qualify = false;
              for (const label of qualifyLabels) {
                  if (prLabels.find(l => l.name === label)) {
                      console.log(`PR labels ${prLabels.map(l => l.name)} contain qualifying label ${label}`);
                      qualify = true;
                  }
              }
          }

          // if qualification failed, log the reason
          if (!qualify) {
              console.log(`Qualify users: ${qualifyUsers}`);
              console.log(`Qualify labels: ${qualifyLabels}`);
              console.log(`Actor ${actor} and labels ${prLabels.map(l => l.name)} do not qualify for auto-approval!`);
          }

          core.setOutput('qualify', qualify);

    - name: Auto-approve PR
      if: ${{ steps.qualify.outputs.qualify == 'true' }}
      shell: bash
      run: |
        gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve
